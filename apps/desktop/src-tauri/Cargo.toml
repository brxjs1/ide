[package]
name = "ide-desktop"
description = "App desktop do ide (Tauri 2)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# O sufixo _lib evita conflito de nome com o binário no Windows.
name = "ide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ide-agent.workspace = true
ide-core.workspace = true
ide-lsp.workspace = true
ide-syntax.workspace = true
ide-pty.workspace = true
ide-timeline.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
